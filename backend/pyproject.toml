[project]
name = "dono-backend"
version = "0.1.0"
description = "Dono FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.35.0", "pydantic==2.11.7",
  "pydantic-settings==2.10.1", "httpx==0.28.1", "python-multipart==0.0.20",
  "pillow==11.3.0", "psycopg[binary,pool]==3.2.9",
]
[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-cov==6.2.1",
    "ruff==0.12.9",
    "mypy==1.17.1",
    "black==25.1.0",
    "pgserver==0.1.4",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.uv]
exclude-newer = "2026-10-18T00:00:00Z"

[tool.mypy]
python_version = "3.12"
strict = true
[tool.ruff]
target-version = "py312"
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
[tool.coverage.run]
source = ["app"]
branch = true
