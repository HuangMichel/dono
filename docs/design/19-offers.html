<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dono — Offers nearby</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="tokens.js"></script>
<script src="shell.js"></script>
<link rel="stylesheet" href="ui.css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="bg-sand-1 text-sand-12 font-sans text-body antialiased">
<section>
    <div class="flex flex-col md:flex-row min-h-[680px]">
      <div data-shell="offers" data-dir="a"></div>
      <div class="flex-1 min-w-0 flex flex-col md:flex-row">
        <section class="flex-1 min-w-0 p-6 max-w-[1280px]">
          <div class="flex items-baseline justify-between">
            <h2 class="text-title-sm font-semibold">Offers nearby</h2>
            <span class="text-meta text-sand-11 num">24 open within 5 km</span>
          </div>
          <div class="mt-4 flex flex-wrap items-center gap-2">
            <div class="p-0.5 rounded-lg bg-sand-3 flex text-meta" role="tablist" aria-label="Category">
              <button role="tab" aria-selected="true" class="h-8 px-3 rounded-[6px] bg-sand-1 border-hair border-sand-7 font-medium">All</button>
              <button role="tab" class="h-8 px-3 rounded-[6px] text-sand-11">Clothes</button>
              <button role="tab" class="h-8 px-3 rounded-[6px] text-sand-11">Shoes</button>
              <button role="tab" class="h-8 px-3 rounded-[6px] text-sand-11">Food</button>
              <button role="tab" class="h-8 px-3 rounded-[6px] text-sand-11">Care</button>
            </div>
            <select class="field w-32 text-meta" aria-label="Donor"><option>Everyone</option><option>Individuals</option><option>Companies</option></select>
            <select class="field w-32 text-meta" aria-label="Distance"><option>Within 2 km</option><option selected>Within 5 km</option><option>Within 10 km</option></select>
            <button aria-pressed="true" class="h-8 px-3 rounded-[16px] bg-grass-3 text-grass-11 text-meta font-medium flex items-center gap-2"><span class="w-3 h-3 rounded-[2px] bg-grass-9" aria-hidden="true"></span>Matches my needs</button>
          </div>
          <div class="mt-5 grid grid-cols-2 sm:grid-cols-3 gap-x-3 gap-y-5">
            <button class="text-left" aria-current="true"><span class="relative block aspect-square rounded-lg photo"><span class="absolute right-1.5 top-1.5 w-7 h-7 rounded-full bg-grass-9 text-white grid place-items-center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="absolute left-1.5 top-1.5 chip bg-sand-1">Shoes</span><span class="absolute left-1.5 bottom-1.5 chip bg-grass-3 text-grass-11">Sole wear low 22%</span></span><p class="mt-2 font-medium text-grass-11 truncate">Children's shoes, 4 pairs</p><p class="text-meta text-sand-11 num truncate">Camille D., 1.3 km, 25 min ago</p></button>
            <button class="text-left"><span class="relative block aspect-square rounded-lg photo"><span class="absolute left-1.5 top-1.5 chip bg-sand-1">Clothes</span><span class="absolute left-1.5 bottom-1.5 chip bg-orange-3 text-orange-11">Stains 61%</span></span><p class="mt-2 font-medium truncate">Winter coats, 3</p><p class="text-meta text-sand-11 num truncate">Hugo T., 0.8 km, 40 min ago</p></button>
            <button class="text-left"><span class="relative block aspect-square rounded-lg photo"><span class="absolute left-1.5 top-1.5 chip bg-sand-1">Food</span><span class="absolute left-1.5 bottom-1.5 chip bg-grass-3 text-grass-11 num">Best before in 210 days</span></span><p class="mt-2 font-medium truncate">Rice 1 kg, 10 packs</p><p class="text-meta text-sand-11 num truncate">Franprix Parmentier, 1.0 km, 1 h ago</p></button>
            <button class="text-left opacity-60"><span class="relative block aspect-square rounded-lg photo"><span class="absolute left-1.5 top-1.5 chip bg-sand-1">Food</span><span class="absolute left-1.5 bottom-1.5 chip bg-sand-4 text-sand-11">Claimed</span></span><p class="mt-2 font-medium truncate">Lentils 500 g, 8 packs</p><p class="text-meta text-sand-11 num truncate">Lina S., 2.1 km, 1 h ago</p></button>
            <button class="text-left"><span class="relative block aspect-square rounded-lg photo"><span class="absolute left-1.5 top-1.5 chip bg-sand-1">Clothes</span><span class="absolute left-1.5 bottom-1.5 chip bg-grass-3 text-grass-11">Light wear 74%</span></span><p class="mt-2 font-medium truncate">Winter coat, L</p><p class="text-meta text-sand-11 num truncate">Inès R., 2.6 km, 2 h ago</p></button>
            <button class="text-left"><span class="relative block aspect-square rounded-lg photo"><span class="absolute left-1.5 top-1.5 chip bg-sand-1">Shoes</span><span class="absolute left-1.5 bottom-1.5 chip bg-grass-3 text-grass-11">Pair complete likely 98%</span></span><p class="mt-2 font-medium truncate">Snow boots, 33</p><p class="text-meta text-sand-11 num truncate">Amira K., 4.1 km, 5 h ago</p></button>
          </div>
        </section>
        <aside class="w-full md:w-[360px] shrink-0 border-t-hair md:border-t-0 md:border-l-hair border-sand-6 flex flex-col">
          <div class="flex-1 p-5">
            <div class="aspect-[4/3] rounded-lg photo"></div>
            <h3 class="mt-4 text-title-sm font-semibold">Children's shoes, 4 pairs</h3>
            <p class="mt-1 text-meta text-sand-11 num">Shoes, Camille D., individual, 1.3 km, 25 min ago</p>
            <span class="mt-2 inline-block chip bg-grass-3 text-grass-11">Matches your need: Children's shoes, 28 to 34</span>
            <h4 class="mt-5 mb-2 font-semibold">Indicators</h4>
            <dl class="divide-y-hair divide-sand-6 border-t-hair border-b-hair border-sand-6">
              <div class="py-2 flex justify-between"><dt>Pairs complete</dt><dd><span class="font-medium text-grass-11">Likely</span> <span class="num text-sand-11">96%</span></dd></div>
              <div class="py-2 flex justify-between"><dt>Sole wear</dt><dd>Low <span class="num text-sand-11">22%</span></dd></div>
              <div class="py-2 flex justify-between"><dt>Upper damage</dt><dd>Unlikely <span class="num text-sand-11">9%</span></dd></div>
            </dl>
            <div class="mt-4 rounded-lg bg-sand-2 px-4 py-3 flex items-center justify-between gap-3 num"><span>Store room A</span><span><span class="font-medium">59 free</span> <span class="text-sand-11">of 155</span></span></div>
          </div>
          <div class="border-t-hair border-sand-6 p-4 flex gap-2">
            <button class="flex-1 h-9 rounded-[6px] bg-sand-3 hover:bg-sand-4 transition-colors duration-250 ease-out font-medium">Hide</button>
            <button class="flex-1 h-9 rounded-[6px] bg-grass-9 hover:bg-grass-10 transition-colors duration-250 ease-out text-white font-medium">Claim offer</button>
          </div>
        </aside>
      </div>
    </div>
  </section>
</body>
</html>
