<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dono — Images</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="tokens.js"></script>
<script src="shell.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ui.css" />
</head>
<body class="bg-sand-1 text-sand-12 font-sans text-body antialiased">
<section>
  <div class="flex flex-col md:flex-row min-h-[640px]">
    <div data-shell="images" data-dir="a"></div>
    <main class="flex-1 min-w-0 p-6 max-w-[1280px]">
      <h2 class="text-title-sm font-semibold">Images</h2>
      <div class="mt-3 flex flex-wrap items-center gap-2">
        <div class="p-0.5 rounded-lg bg-sand-3 flex text-meta" role="tablist">
          <button role="tab" aria-selected="true" class="h-8 px-3 rounded-[6px] bg-sand-1 border-hair border-sand-7 font-medium">All</button>
          <button role="tab" class="h-8 px-3 rounded-[6px] text-sand-11">Food</button>
          <button role="tab" class="h-8 px-3 rounded-[6px] text-sand-11">Care</button>
          <button role="tab" class="h-8 px-3 rounded-[6px] text-sand-11">Clothes</button>
        </div>
        <button aria-pressed="true" class="h-8 px-3 rounded-[16px] bg-orange-3 text-orange-11 text-meta font-medium">Stains</button>
        <button class="h-8 px-3 rounded-[16px] bg-sand-3 text-sand-11 text-meta font-medium">Sealed</button>
        <button aria-pressed="true" class="h-8 px-3 rounded-[16px] bg-red-3 text-red-11 text-meta font-medium">Medicine</button>
        <button class="h-8 px-3 rounded-[16px] bg-sand-3 text-sand-11 text-meta font-medium">Unreadable date</button>
      </div>
      <div class="mt-4 grid xl:grid-cols-[1fr_300px] gap-5 items-start">
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <figure class="rounded-xl overflow-hidden border-hair border-sand-6">
            <div class="photo aspect-square relative"><span class="absolute left-2 top-2 chip bg-sand-1">Food</span><span class="absolute right-2 top-2 chip bg-grass-3 text-grass-11 num">142 d</span></div>
            <figcaption class="p-2.5"><p class="font-medium text-body">Pasta ×6</p><p class="text-meta text-sand-11">Sealed 93%</p><p class="text-meta text-sand-11 num">Approved by Léa, 25 Oct</p></figcaption>
          </figure>
          <figure class="rounded-xl overflow-hidden border-hair border-red-7">
            <div class="photo aspect-square relative"><span class="absolute left-2 top-2 chip bg-sand-1">Food</span><span class="absolute right-2 top-2 chip bg-red-3 text-red-11 num">5 d</span></div>
            <figcaption class="p-2.5"><p class="font-medium text-body">Canned tuna ×4</p><p class="text-meta text-red-11">Use by, 5 days</p><p class="text-meta text-sand-11 num">Approved by Léa, 24 Oct</p></figcaption>
          </figure>
          <figure class="rounded-xl overflow-hidden border-hair border-sand-6">
            <div class="photo aspect-square relative"><span class="absolute left-2 top-2 chip bg-sand-1">Care</span><span class="absolute right-2 top-2 chip bg-red-9 text-white">Med 34%</span></div>
            <figcaption class="p-2.5"><p class="font-medium text-body">Shower gel</p><p class="text-meta text-sand-11">Sealed 90%</p><p class="text-meta text-sand-11 num">Received by Léa, 23 Oct</p></figcaption>
          </figure>
          <figure class="rounded-xl overflow-hidden border-hair border-sand-6">
            <div class="photo aspect-square relative"><span class="absolute left-2 top-2 chip bg-sand-1">Clothes</span><span class="absolute right-2 top-2 chip bg-orange-3 text-orange-11">Stains 61%</span></div>
            <figcaption class="p-2.5"><p class="font-medium text-body">Winter coat, M</p><p class="text-meta text-sand-11">Stains likely 61%</p><p class="text-meta text-sand-11 num">Approved by Léa, 24 Oct</p></figcaption>
          </figure>
          <figure class="rounded-xl overflow-hidden border-hair border-sand-6">
            <div class="photo aspect-square relative"><span class="absolute left-2 top-2 chip bg-sand-1">Shoes</span></div>
            <figcaption class="p-2.5"><p class="font-medium text-body">Sneakers, 38</p><p class="text-meta text-sand-11">Pair complete likely, sole wear low</p></figcaption>
          </figure>
          <figure class="rounded-xl overflow-hidden border-hair border-sand-6">
            <div class="photo aspect-square relative"><span class="absolute left-2 top-2 chip bg-sand-1">Food</span><span class="absolute right-2 top-2 chip bg-amber-3 text-amber-11">Unreadable</span></div>
            <figcaption class="p-2.5"><p class="font-medium text-body">Flour 1 kg</p><p class="text-meta text-sand-11">Date unreadable</p><p class="text-meta text-sand-11 num">Received by Sami, 22 Oct</p></figcaption>
          </figure>
        </div>
        <aside class="space-y-3">
          <section class="rounded-xl border-hair border-sand-6 p-4">
            <h3 class="font-medium">Expiry buckets <span class="text-meta text-sand-11 font-normal num">80 items</span></h3>
            <ul class="mt-3 space-y-1.5 text-body">
              <li class="flex justify-between"><span class="text-red-11">Expired</span><span class="num font-medium">4</span></li>
              <li class="flex justify-between"><span class="text-red-11">Under 7 days</span><span class="num font-medium">6</span></li>
              <li class="flex justify-between"><span class="text-orange-11">7 – 30 days</span><span class="num font-medium">12</span></li>
              <li class="flex justify-between"><span class="text-amber-11">30 – 90 days</span><span class="num font-medium">18</span></li>
              <li class="flex justify-between"><span class="text-grass-11">Over 90 days</span><span class="num font-medium">40</span></li>
              <li class="flex justify-between border-t-hair border-sand-6 pt-1.5"><span class="text-amber-11">Unreadable dates</span><span class="num font-medium">5</span></li>
            </ul>
          </section>
          <section class="rounded-xl border-hair border-sand-6 p-4">
            <h3 class="font-medium">Distribute first, FEFO</h3>
            <ol class="mt-3 space-y-2 text-body">
              <li class="flex justify-between"><span class="num">1</span><span class="flex-1 px-2">Canned tuna ×4</span><span class="text-red-11 num">5 d</span></li>
              <li class="flex justify-between"><span class="num">2</span><span class="flex-1 px-2">Rice ×2</span><span class="text-orange-11 num">21 d</span></li>
              <li class="flex justify-between"><span class="num">3</span><span class="flex-1 px-2">Shower gel ×4</span><span class="text-amber-11 num">48 d</span></li>
            </ol>
          </section>
          <section class="rounded-xl bg-sand-2 p-4 text-body">
            <h3 class="font-medium">Quality</h3>
            <p class="mt-2 flex justify-between"><span class="text-sand-11">Average shelf life</span><span class="num font-medium">148 days</span></p>
            <p class="mt-1 flex justify-between"><span class="text-sand-11">AI vs staff agreement</span><span class="num font-medium">87%</span></p>
                      </section>
        </aside>
      </div>
    </main>
  </div>
</section>
</body>
</html>
