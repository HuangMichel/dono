<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dono — Association register</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="tokens.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ui.css" />
</head>
<body class="bg-sand-1 text-sand-12 font-sans text-body antialiased">
<section>

  <div class="max-w-[560px] mx-auto px-5 py-12">
    <div class="flex items-center gap-2" aria-label="Progress: step 2 of 3">
      <span class="flex items-center gap-1.5"><span class="w-6 h-6 rounded-full bg-grass-9 text-white text-meta font-semibold grid place-items-center num">1</span><span class="text-meta text-sand-11">Identity</span></span>
      <span class="flex-1 h-[0.5px] bg-grass-8"></span>
      <span class="flex items-center gap-1.5"><span class="w-6 h-6 rounded-full bg-sand-1 border-hair border-sand-8 text-sand-12 text-meta font-semibold grid place-items-center num">2</span><span class="text-meta font-medium">Categories</span></span>
      <span class="flex-1 h-[0.5px] bg-sand-6"></span>
      <span class="flex items-center gap-1.5"><span class="w-6 h-6 rounded-full bg-sand-3 text-sand-11 text-meta font-semibold grid place-items-center num">3</span><span class="text-meta text-sand-11">Drop-off</span></span>
    </div>

    <h2 class="mt-8 text-title font-semibold">What can you receive?</h2>
    <p class="mt-1 text-sand-11">Pick categories now — capacity and slots come later.</p>

    <div class="mt-6 space-y-2">
      <label class="flex items-center gap-3 rounded-xl border-hair border-grass-8 bg-grass-2 px-4 py-3"><input type="checkbox" checked /><span class="flex-1"><span class="font-medium block">Clothes</span><span class="text-meta text-sand-11">type, size, season, wear, stains, holes, pilling</span></span></label>
      <label class="flex items-center gap-3 rounded-xl border-hair border-sand-6 px-4 py-3"><input type="checkbox" /><span class="flex-1"><span class="font-medium block">Shoes</span><span class="text-meta text-sand-11">pair complete, size, sole wear</span></span></label>
      <label class="flex items-center gap-3 rounded-xl border-hair border-sand-6 px-4 py-3"><input type="checkbox" /><span class="flex-1"><span class="font-medium block">Food — non-perishable</span><span class="text-meta text-sand-11">expiry date, DLC vs DDM, damaged packaging</span></span></label>
      <label class="flex items-center gap-3 rounded-xl border-hair border-sand-6 px-4 py-3"><input type="checkbox" /><span class="flex-1"><span class="font-medium block">Parapharmacy & hygiene</span><span class="text-meta text-red-11">medicines are never accepted — pharmacy take-back</span></span></label>
      <label class="flex items-center gap-3 rounded-xl border-hair border-sand-6 px-4 py-3"><input type="checkbox" /><span class="flex-1"><span class="font-medium block">Small furniture</span><span class="text-meta text-sand-11">donor brings it</span></span></label>
    </div>

    <div class="mt-8 flex items-center justify-between">
      <a class="h-11 px-5 rounded-[22px] border-hair border-sand-7 font-semibold flex items-center" href="#">Back</a>
      <button class="h-11 px-5 rounded-[22px] bg-grass-9 hover:bg-grass-10 transition-colors duration-250 ease-out text-white font-semibold">Continue</button>
    </div>
      </div>
</section>
</body>
</html>
